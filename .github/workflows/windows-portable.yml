name: Build Counter

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build portable application
        run: npm run dist:win

      - name: Check packaged Windows application
        shell: powershell
        run: ./scripts/Test-Portable.ps1 -Executable dist/Counter.exe -Report dist/windows-checks.json

      - name: Upload Windows check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-checks
          path: dist/windows-checks.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Counter
          path: dist/Counter.exe
          retention-days: 7
          if-no-files-found: error
