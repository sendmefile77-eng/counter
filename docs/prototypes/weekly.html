<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ЛАД · три варіанти огляду тижня</title><style>
:root{color-scheme:dark;--bg:#0b121c;--panel:#121e2c;--line:#425a73;--text:#edf2f8;--muted:#a0b0c3;--gold:#e4c28b;--blue:#78baff;--green:#60d9a6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 'Segoe UI',sans-serif}main{max-width:1280px;margin:auto;padding:32px 28px 110px}button,input{font:inherit}button,summary{cursor:pointer}button{background:#162334;color:var(--text);border:1px solid #6b87a4;padding:10px 16px;border-radius:9px;min-height:42px}button:hover{border-color:var(--gold)}button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}button:disabled{opacity:.4;cursor:default}h1{font-size:36px;line-height:1.2;margin:10px 0}h2{font-size:20px;margin:0 0 14px}h3{font-size:17px;margin:0}p{margin:8px 0}small,.muted{color:var(--muted)}.brand{color:var(--gold);font-size:12px;letter-spacing:.13em;font-weight:700}.intro{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.demo{border:1px solid var(--line);border-radius:9px;padding:9px 12px;color:var(--gold);font-size:12px}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:18px 0 24px}.controls strong{min-width:240px;text-align:center}.controls label{display:flex;gap:8px;align-items:center;margin-left:auto}input{accent-color:var(--gold)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.metric,.panel,.person,.action{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:22px;min-width:0}.metric{border-top:3px solid var(--blue)}.metric:nth-child(2){border-top-color:var(--green)}.metric:nth-child(3){border-top-color:var(--gold)}.metric strong{display:block;font-size:34px;line-height:1.4;font-variant-numeric:tabular-nums}.metric span{color:var(--muted)}.panel{margin-top:20px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-variant-numeric:tabular-nums}th,td{padding:15px 12px;border-bottom:1px solid #27384c;text-align:left}th{color:var(--muted);font-size:12px}td small{display:block}td:first-child{white-space:normal;min-width:160px}details{border-top:1px solid #27384c;margin-top:16px;padding-top:14px}summary{color:var(--gold);padding:5px 0}.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:20px}.person header{display:flex;align-items:center;gap:12px}.avatar{display:grid;place-items:center;width:44px;height:44px;flex:none;background:#24384f;border:1px solid var(--blue);border-radius:50%;color:var(--blue);font-weight:700}.status{margin-left:auto;border:1px solid var(--line);padding:4px 9px;border-radius:7px;font-size:12px;white-space:nowrap}.attention{color:#f3bc78}.numbers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:20px 0;gap:8px}.numbers b{display:block;font-size:24px}.numbers small{font-size:11px}.tasks{list-style:none;margin:10px 0;padding:0}.tasks li{padding:9px 0;border-bottom:1px solid #27384c}.task-label{display:block;color:var(--muted);font-size:12px}.actions-layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,.8fr);gap:20px}.action{margin-bottom:12px;border-left:3px solid #f3bc78}.action.done{border-left-color:var(--green)}.action small{display:block}.compact{display:grid;gap:12px}.compact .metric{padding:18px}.compact .metric strong{font-size:30px}.empty{padding:32px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;margin-top:20px}.caption,.keyhint{color:var(--muted);font-size:13px;margin:18px 0}.filter-count{color:var(--muted);font-size:13px}@media(max-width:760px){main{padding:22px 16px 110px}h1{font-size:28px}.grid,.people,.actions-layout{grid-template-columns:1fr}.controls label{margin-left:0}.controls strong{min-width:160px}.status{margin-left:0}.person header{flex-wrap:wrap}.person h3{overflow-wrap:anywhere}.metric strong{font-size:30px}}
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12)}.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}@media(prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out,transform 160ms cubic-bezier(.23,1,.32,1)}@media(hover:hover) and (pointer:fine){.proto-picker-item:hover{color:rgba(255,255,255,.85)}}.proto-picker-item:active{transform:scale(.97)}.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}.proto-picker-item[data-active]{color:#fff}.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}.proto-picker-replay{padding:0 10px;font-size:14px}.proto-picker[data-position=top]{bottom:auto;top:24px}
</style><main><div class="intro"><div><span class="brand">ЛАД · ДЛЯ КЕРІВНИКА</span><h1>Огляд тижня</h1><p class="muted">Хто працював, який результат і що потребує уваги.</p></div><span class="demo">Демонстраційні дані · не робоча база</span></div><div class="controls"><button data-week="-1" aria-label="Попередній тиждень">←</button><strong id="week-label" aria-live="polite"></strong><button data-week="1" aria-label="Наступний тиждень">→</button><button data-current>Останній завершений</button><label><input id="attention-filter" type="checkbox">Лише потребує уваги</label></div><p class="filter-count">Підсумки — за всю команду; фільтр змінює список нижче.</p><div id="stage"></div><p class="keyhint">Варіанти внизу: 1 / 2 / 3 або стрілки. Можна змінити тиждень і розгорнути подробиці.</p></main><nav class="proto-picker" aria-label="Prototype variants"><span class="proto-picker-highlight" aria-hidden="true"></span><button class="proto-picker-item" data-active aria-current="true">Огляд</button><button class="proto-picker-item">Люди</button><button class="proto-picker-item">Дії</button></nav><script>
'use strict';
const data=[{name:'Олена',position:'Аналітикиня',days:5,plan:5,objects:4,reasons:'Без виключень',duties:2,tasks:[['Підготувати довідку','done'],['Оновити перелік джерел','open']]},{name:'Віктор',position:'Старший аналітик',days:3,plan:5,objects:2,reasons:'Лікарняний — 2 дні',duties:1,tasks:[['Завершити перевірку об’єкта','overdue'],['Узгодити висновки','done']]},{name:'Юлія_О',position:'Аналітикиня',days:4,plan:5,objects:3,reasons:'Відпустка — 1 день',duties:1,tasks:[['Оновити картки об’єктів','done']]},{name:'Юлія_С',position:'Аналітикиня',days:5,plan:5,objects:2,reasons:'Без виключень',duties:2,tasks:[['Підготувати тижневий огляд','open'],['Перевірити нові матеріали','done']]}];
const weeks=['26 жовтня – 1 листопада 2026','2–8 листопада 2026','9–15 листопада 2026'];let week=2,attention=false;
const number=n=>n.toLocaleString('uk-UA',{maximumFractionDigits:1}),kpi=p=>p.days?number(p.objects*1.5/p.days*100)+'%':'—';
const source=()=>data.map((p,i)=>({...p,objects:Math.max(0,p.objects-(2-week)*(i%2)),tasks:p.tasks.map(([title,status])=>({title,status:week===2?status:status==='open'?'done':status}))}));
const needs=p=>p.tasks.some(t=>t.status!=='done')||p.objects*1.5/p.days<.8,shown=()=>source().filter(p=>!attention||needs(p));
const statusText={done:'Виконано',open:'Не виконано',overdue:'Прострочено'};
function summary(compact=false){const rows=source(),days=rows.reduce((n,p)=>n+p.days,0),objects=rows.reduce((n,p)=>n+p.objects,0),all=rows.flatMap(p=>p.tasks),done=all.filter(t=>t.status==='done').length;return `<div class="${compact?'compact':'grid'}"><article class="metric"><span>Фактично відпрацьовано</span><strong>${days} <small>із 20</small></strong><small>Лікарняний — 2 · відпустка — 1 день</small></article><article class="metric"><span>Прийнято об’єктів</span><strong>${objects}</strong><small>KPI команди: <b data-summary-kpi>${number(objects*1.5/days*100)}%</b> · норма 1,5 дня</small></article><article class="metric"><span>Завдань виконано</span><strong>${done} <small>із ${all.length}</small></strong><small>${all.length-done} залишилося · ${all.filter(t=>t.status==='overdue').length} прострочено</small></article></div>`;}
function tasks(p){return `<ul class="tasks">${p.tasks.map(t=>`<li>${t.status==='done'?'✓':'○'} ${t.title}<span class="task-label ${t.status==='overdue'?'attention':''}">${statusText[t.status]}</span></li>`).join('')}</ul>`;}
const empty='<div class="empty">За цим фільтром питань немає. Вимкніть фільтр, щоб побачити всю команду.</div>';
function tableView(){const rows=shown();return summary()+`<section class="panel"><h2>Робота команди</h2>${rows.length?`<div class="table-wrap" tabindex="0" role="region" aria-label="Результати працівників"><table><thead><tr><th>Працівник</th><th>Дні / план</th><th>Об’єкти</th><th>KPI</th><th>Завдання</th></tr></thead><tbody>${rows.map(p=>`<tr><td><b>${p.name}</b><small>${p.position}</small><details><summary>Розгорнути завдання</summary>${tasks(p)}<p class="muted">Чергувань: ${p.duties}</p></details></td><td>${p.days} із ${p.plan}<small>${p.reasons}</small></td><td>${p.objects}</td><td>${kpi(p)}</td><td>${p.tasks.filter(t=>t.status==='done').length} із ${p.tasks.length}<small>${p.tasks.filter(t=>t.status==='overdue').length} прострочено</small></td></tr>`).join('')}</tbody></table></div>`:empty}</section><p class="caption">Огляд: порівняння всіх працівників. Подробиці приховано в рядках.</p>`;}
function peopleView(){return summary()+`<div class="people">${shown().map(p=>`<article class="person"><header><span class="avatar" aria-hidden="true">${p.name[0]}</span><div><h3>${p.name}</h3><small>${p.position}</small></div><span class="status ${needs(p)?'attention':''}">${needs(p)?'Потребує уваги':'Без питань'}</span></header><div class="numbers"><div><b>${p.days}/${p.plan}</b><small>відпрацьовано днів</small></div><div><b>${p.objects}</b><small>прийнято об’єктів</small></div><div><b>${kpi(p)}</b><small>KPI</small></div></div><p class="muted">${p.reasons} · чергувань ${p.duties}</p><details><summary>Завдання: ${p.tasks.filter(t=>t.status==='done').length} із ${p.tasks.length} виконано</summary>${tasks(p)}</details></article>`).join('')}</div>${shown().length?'':empty}<p class="caption">Люди: повніший контекст про кожного. Більше прокручування для великої команди.</p>`;}
function actionsView(){const items=shown().flatMap(p=>p.tasks.filter(t=>!attention||t.status!=='done').map(t=>({...t,person:p}))).sort((a,b)=>['overdue','open','done'].indexOf(a.status)-['overdue','open','done'].indexOf(b.status));return `<div class="actions-layout"><section><h2>Справи та строки</h2>${items.map(t=>`<article class="action ${t.status==='done'?'done':''}"><h3>${t.title}</h3><small>${t.person.name} · ${statusText[t.status]}</small><details><summary>Подробиці працівника</summary><p>${t.person.days} із ${t.person.plan} днів · ${t.person.objects} об’єктів · KPI ${kpi(t.person)}</p><p class="muted">${t.person.reasons} · чергувань ${t.person.duties}</p></details></article>`).join('')||empty}</section><aside>${summary(true)}<section class="panel"><h2>Що перевірити</h2>${source().filter(needs).map(p=>`<p>${p.name}: ${p.tasks.filter(t=>t.status!=='done').length} незавершених завдань · KPI ${kpi(p)}.</p>`).join('')}<small>Приводи для перевірки, а не автоматична оцінка працівника.</small></section></aside></div><p class="caption">Дії: найперше видно незавершені справи. Порівнювати команду менш зручно.</p>`;}
const variants=[tableView,peopleView,actionsView];
function weekControls(){document.getElementById('week-label').textContent=weeks[week];document.querySelector('[data-week="-1"]').disabled=week===0;document.querySelector('[data-week="1"]').disabled=week===2;}
document.querySelectorAll('[data-week]').forEach(b=>b.addEventListener('click',()=>{week=Math.max(0,Math.min(2,week+Number(b.dataset.week)));weekControls();mount(current);}));document.querySelector('[data-current]').addEventListener('click',()=>{week=2;weekControls();mount(current);});document.getElementById('attention-filter').addEventListener('change',e=>{attention=e.target.checked;mount(current);});weekControls();
const stage=document.getElementById('stage'),picker=document.querySelector('.proto-picker'),highlight=picker.querySelector('.proto-picker-highlight'),items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')],replay=picker.querySelector('.proto-picker-replay');let current=0;
function moveHighlight(){const el=items[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`;}
function mount(i){stage.innerHTML='';requestAnimationFrame(()=>{stage.innerHTML=variants[i]();});}
function setActive(i){if(i<0||i>=variants.length)return;current=i;items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current');});moveHighlight();const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);mount(i);}
items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));replay?.addEventListener('click',()=>mount(current));window.addEventListener('resize',moveHighlight);
document.addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.metaKey||e.ctrlKey||e.altKey)return;const num=parseInt(e.key,10);if(num>=1&&num<=variants.length)setActive(num-1);else if(e.key==='ArrowRight')setActive((current+1)%variants.length);else if(e.key==='ArrowLeft')setActive((current-1+variants.length)%variants.length);else if(e.key==='r'||e.key==='R')mount(current);});
const requested=parseInt(new URLSearchParams(location.search).get('v'),10);setActive(requested>=1&&requested<=variants.length?requested-1:0);requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
</script></html>
